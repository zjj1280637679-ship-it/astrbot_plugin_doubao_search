name: astrbot_plugin_doubao_search
display_name: "豆包联网搜索与图片转发"
desc: "让你的 AI 获得豆包联网搜索与相关图片转发能力。你可以用自然语言或中文命令搜索网页、筛选时效、获取带来源的摘要，或把 1-5 张公开图片直接发送到当前对话；插件会把搜索结果标记为不可信外部资料，并且不会把密钥或远端错误正文写进回执。"
short_desc: "让你的 AI 使用豆包联网搜索，并把相关图片发送到当前对话"
